name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Le token n'a besoin que de publier des Pages, rien d'autre.
permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # La version de pnpm est lue dans le champ `packageManager` du
      # package.json : sans lui, l'action échoue sur « No pnpm version is
      # specified ». Cette étape doit précéder setup-node, dont le cache pnpm
      # a besoin que la commande existe.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les ids de tâches sont le contrat avec les sauvegardes déjà écrites :
      # un `requires` mort ou un id dupliqué ne doit jamais atteindre la prod.
      - name: Vérifier le contenu et les types
        run: pnpm check

      - uses: actions/configure-pages@v6

      # Dépôt de projet → l'app est servie depuis /<nom-du-depot>/. Le nom est
      # dérivé de GITHUB_REPOSITORY, toujours défini, plutôt que de la charge
      # utile de l'événement, qui varie d'un déclencheur à l'autre.
      #
      # Pour un dépôt utilisateur (<pseudo>.github.io) ou un domaine
      # personnalisé, remplacer la valeur par NUXT_APP_BASE_URL="/".
      - name: Construire le site statique
        run: |
          export NUXT_APP_BASE_URL="/${GITHUB_REPOSITORY#*/}/"
          echo "Chemin de base : $NUXT_APP_BASE_URL"
          pnpm generate

      # Doit rester en phase avec deploy-pages : le format d'artefact a changé
      # entre les majeures.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
