name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Le token n'a besoin que de publier des Pages, rien d'autre.
permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les ids de tâches sont le contrat avec les sauvegardes déjà écrites :
      # un `requires` mort ou un id dupliqué ne doit jamais atteindre la prod.
      - name: Vérifier le contenu et les types
        run: pnpm check

      - uses: actions/configure-pages@v5

      - name: Construire le site statique
        env:
          # Dépôt de projet → l'app est servie depuis /<nom-du-depot>/.
          # Pour un dépôt utilisateur (<pseudo>.github.io) ou un domaine
          # personnalisé, remplacer par NUXT_APP_BASE_URL: /
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: pnpm generate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
